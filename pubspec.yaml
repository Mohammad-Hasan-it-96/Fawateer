name: billing_app
description: A new Flutter project.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5
  
  # Functional Programming
  fpdart: ^1.1.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Database — Drift (SQLite)
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.24

  # UI & Utilities
  flutter_vibrate: ^1.3.0
  intl: ^0.20.2
  permission_handler: ^11.3.1
  
  # Scanner & Printer
  print_bluetooth_thermal: ^1.1.2
  # 7.x is required for invertImage (white-on-red barcodes — ML Kit can't read
  # inverted codes natively), built-in tapToFocus, and autoZoom. 5.x had none.
  mobile_scanner: ^7.4.0
  # Pure-Dart 1D/2D code generation for printed product labels (Plan 010).
  barcode: ^2.2.0
  bloc: ^8.1.4
  uuid: ^4.5.2
  app_settings: ^7.0.0

  # Networking & Licensing (subscription verification)
  http: ^1.2.0
  crypto: ^3.0.3
  android_id: ^0.4.0            # device-id on Android (ANDROID_ID)
  device_info_plus: ^12.4.0     # device-id on iOS (identifierForVendor)
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0     # installed app version (remote update check)

  # Manager lock (Plan 016 B) — fingerprint / face as a shortcut past the PIN.
  # Needs MainActivity to extend FlutterFragmentActivity on Android.
  local_auth: ^2.3.0

  # Sharing (customer account statements)
  share_plus: ^10.1.4

  # Charts (Plan 008 analytics dashboard) — pure-Dart, offline, no native deps.
  fl_chart: ^0.69.0

  # Cloud backup (Plan 001) — Google Drive via the user's own account.
  # drive.file scope only (non-sensitive; no Play Console). See
  # docs/plans/001-backup-system.md and docs/google-drive-api-setup.md.
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  path_provider: ^2.1.5

  # Push notifications (FCM live-unlock of the subscription).
  # Dormant until a Firebase project is configured (see android/README-fcm.md);
  # Firebase.initializeApp() fails gracefully and push stays disabled without it.
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  audioplayers: ^6.7.1
  # Renders notification-type FCM messages while the app is foregrounded — the
  # OS only auto-displays those in the background. Needs core-library
  # desugaring (enabled in android/app/build.gradle.kts).
  flutter_local_notifications: ^22.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.4

# Launcher icon generation (run: dart run flutter_launcher_icons).
# Source art in assets/logo: the ribbon-ف mark (icon_mark), the adaptive
# foreground (mark at ~62% with mask-safe margins), the gradient background,
# and the composed full-bleed square used for legacy (pre-8.0) launchers.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/icon_full.png"
  adaptive_icon_background: "assets/logo/icon_bg.png"
  adaptive_icon_foreground: "assets/logo/icon_fg_adaptive.png"

flutter:
  generate: true
  uses-material-design: true

  # Cairo is bundled, not fetched. This app is offline-first and Arabic-only in
  # practice: a shop's first launch is often on a device with no connectivity,
  # and the `google_fonts` runtime fetch would silently fall back to Roboto and
  # render the whole UI in a font with no Arabic shaping. Both faces are real
  # static instances cut from the upstream Cairo variable font (wght 400 / 700),
  # so `FontWeight.bold` uses a drawn bold rather than a synthesized one.
  assets:
    - assets/sounds/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
